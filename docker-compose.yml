services:
  web:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3001:3000"
    command: sh -c "if [ ! -d node_modules/next ]; then npm install; fi && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    env_file:
      - .env.local
